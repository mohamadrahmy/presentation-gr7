<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>reveal.js - Auto Animate</title>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <link rel="stylesheet" href="dist/reveal.css" />
        <link rel="stylesheet" href="dist/theme/black.css" id="theme" />
    </head>
    <body>
        <div class="reveal">
            <div class="slides">
                <!-- Slide 1 -->
                <section data-auto-animate style="height: 600px">
                    <h3 style="opacity: 0.3; font-size: 18px">SLIDE 1</h3>
                    <h2 data-id="title" style="margin-top: 260px">Animate Anything</h2>
                    <div
                        data-id="1"
                        style="
                            background: white;
                            position: absolute;
                            top: 150px;
                            left: 16%;
                            width: 60px;
                            height: 60px;
                        "
                    ></div>
                    <div
                        data-id="2"
                        style="
                            background: white;
                            position: absolute;
                            top: 150px;
                            left: 36%;
                            width: 60px;
                            height: 60px;
                        "
                    ></div>
                    <div
                        data-id="3"
                        style="
                            background: white;
                            position: absolute;
                            top: 150px;
                            left: 56%;
                            width: 60px;
                            height: 60px;
                        "
                    ></div>
                    <div
                        data-id="4"
                        style="
                            background: white;
                            position: absolute;
                            top: 150px;
                            left: 76%;
                            width: 60px;
                            height: 60px;
                        "
                    ></div>
                </section>

                <!-- Slide 2 -->
                <section data-auto-animate style="height: 600px">
                    <h3 style="opacity: 0.3; font-size: 18px">SLIDE 2</h3>
                    <h2 data-id="title" style="margin-top: 500px">With Auto Animate</h2>
                    <div
                        data-id="1"
                        style="
                            background: cyan;
                            position: absolute;
                            bottom: 190px;
                            left: 16%;
                            width: 60px;
                            height: 60px;
                        "
                    ></div>
                    <div
                        data-id="2"
                        style="
                            background: magenta;
                            position: absolute;
                            bottom: 190px;
                            left: 36%;
                            width: 60px;
                            height: 160px;
                        "
                    ></div>
                    <div
                        data-id="3"
                        style="
                            background: yellow;
                            position: absolute;
                            bottom: 190px;
                            left: 56%;
                            width: 60px;
                            height: 260px;
                        "
                    ></div>
                    <div
                        data-id="4"
                        style="
                            background: red;
                            position: absolute;
                            bottom: 190px;
                            left: 76%;
                            width: 60px;
                            height: 360px;
                        "
                    ></div>
                </section>
            </div>
        </div>

        <script src="dist/reveal.js"></script>
        <script>
            Reveal.initialize({
                center: true,
                hash: true,
            });
        </script>
    </body>
</html>
